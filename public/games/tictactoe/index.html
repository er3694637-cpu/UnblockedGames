<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .wrapper {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
    }
    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 8px;
    }
    .cell {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cell:hover { background: #1e293b; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    .cell.win { background: #065f46; border-color: #10b981; }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
    }
    .btn {
      flex: 1;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
    }
    .btn:hover { background: #2563eb; }
    .mode-toggle {
      margin-bottom: 12px;
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .mode-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .mode-btn.active {
      background: #334155;
      color: white;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-vs-ai" onclick="setMode('ai')">vs Computer</button>
      <button class="mode-btn" id="btn-vs-p2" onclick="setMode('pvp')">2 Players</button>
    </div>
    <div class="status" id="status">Turn: Player X</div>
    <div class="grid" id="grid"></div>
    <div class="controls">
      <button class="btn" onclick="initGame()">Reset Game</button>
    </div>
  </div>

  <script>
    let board = Array(9).fill('');
    let turn = 'X';
    let gameOver = false;
    let mode = 'ai'; // 'ai' or 'pvp'

    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const aiBtn = document.getElementById('btn-vs-ai');
    const p2Btn = document.getElementById('btn-vs-p2');

    const WIN_PATTERNS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function setMode(newMode) {
      mode = newMode;
      aiBtn.classList.toggle('active', mode === 'ai');
      p2Btn.classList.toggle('active', mode === 'pvp');
      initGame();
    }

    function initGame() {
      board = Array(9).fill('');
      turn = 'X';
      gameOver = false;
      statusEl.textContent = "Turn: Player X";
      render();
    }

    function render() {
      gridEl.innerHTML = '';
      board.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ` ${val.toLowerCase()}` : '');
        cell.textContent = val;
        cell.addEventListener('click', () => handleClick(idx));
        gridEl.appendChild(cell);
      });
    }

    function handleClick(idx) {
      if (gameOver || board[idx]) return;

      board[idx] = turn;
      render();

      const win = checkWin(board, turn);
      if (win) {
        gameOver = true;
        statusEl.textContent = `Player ${turn} Wins! 🎉`;
        highlightWin(win);
        return;
      }

      if (board.every(cell => cell !== '')) {
        gameOver = true;
        statusEl.textContent = "It's a Draw! 🤝";
        return;
      }

      turn = turn === 'X' ? 'O' : 'X';
      statusEl.textContent = `Turn: Player ${turn}`;

      if (mode === 'ai' && turn === 'O' && !gameOver) {
        setTimeout(makeAIMove, 250);
      }
    }

    function makeAIMove() {
      if (gameOver) return;
      // 1. Can AI win?
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkWin(board, 'O')) {
            render();
            gameOver = true;
            statusEl.textContent = "Computer Wins!";
            highlightWin(checkWin(board, 'O'));
            return;
          }
          board[i] = '';
        }
      }

      // 2. Can player win? Block!
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'X';
          if (checkWin(board, 'X')) {
            board[i] = 'O';
            finishAIMove();
            return;
          }
          board[i] = '';
        }
      }

      // 3. Take center if open
      if (!board[4]) {
        board[4] = 'O';
        finishAIMove();
        return;
      }

      // 4. Take random available
      const emptyIndices = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
      if (emptyIndices.length > 0) {
        const choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        board[choice] = 'O';
        finishAIMove();
      }
    }

    function finishAIMove() {
      render();
      const win = checkWin(board, 'O');
      if (win) {
        gameOver = true;
        statusEl.textContent = "Computer Wins!";
        highlightWin(win);
        return;
      }
      if (board.every(cell => cell !== '')) {
        gameOver = true;
        statusEl.textContent = "It's a Draw!";
        return;
      }
      turn = 'X';
      statusEl.textContent = "Turn: Player X";
    }

    function checkWin(b, player) {
      for (let pattern of WIN_PATTERNS) {
        if (pattern.every(idx => b[idx] === player)) {
          return pattern;
        }
      }
      return null;
    }

    function highlightWin(pattern) {
      pattern.forEach(idx => {
        gridEl.children[idx].classList.add('win');
      });
    }

    initGame();
  </script>
</body>
</html>
