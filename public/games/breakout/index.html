<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 480px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .overlay {
      position: absolute;
      background: rgba(15, 23, 42, 0.88);
      width: 480px;
      height: 400px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:hover { background: #2563eb; }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span id="score" style="color: #38bdf8;">0</span></div>
    <div>LIVES: <span id="lives" style="color: #ef4444;">♥♥♥</span></div>
  </div>

  <div style="position: relative;">
    <canvas id="game" width="480" height="400"></canvas>
    <div id="overlay" class="overlay" style="display: none;">
      <h2 id="over-title" style="font-size: 26px; margin-bottom: 8px;">Game Over</h2>
      <p id="over-score" style="color: #94a3b8;">Score: 0</p>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <div class="hint">Move mouse or use <kbd style="background:#334155; padding:2px 6px; border-radius:4px;">←</kbd> <kbd style="background:#334155; padding:2px 6px; border-radius:4px;">→</kbd> to control the paddle</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overTitle = document.getElementById('over-title');
    const overScore = document.getElementById('over-score');
    const restartBtn = document.getElementById('restart-btn');

    let paddleWidth = 80;
    let paddleHeight = 12;
    let paddleX = (canvas.width - paddleWidth) / 2;

    let ballRadius = 6;
    let ballX = canvas.width / 2;
    let ballY = canvas.height - 40;
    let ballDx = 3.5;
    let ballDy = -3.5;

    let rightPressed = false;
    let leftPressed = false;

    const brickRowCount = 5;
    const brickColumnCount = 8;
    const brickWidth = 50;
    const brickHeight = 16;
    const brickPadding = 6;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 18;

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    let bricks = [];
    let score = 0;
    let lives = 3;
    let isGameOver = false;

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    function reset() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '♥♥♥';
      isGameOver = false;
      paddleX = (canvas.width - paddleWidth) / 2;
      ballX = canvas.width / 2;
      ballY = canvas.height - 40;
      ballDx = 3.5 * (Math.random() > 0.5 ? 1 : -1);
      ballDy = -3.5;
      overlay.style.display = 'none';
      initBricks();
    }

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ballX > b.x &&
              ballX < b.x + brickWidth &&
              ballY > b.y &&
              ballY < b.y + brickHeight
            ) {
              ballDy = -ballDy;
              b.status = 0;
              score += 10;
              scoreEl.textContent = score;
            }
          }
        }
      }

      if (activeBricks === 0) {
        endGame(true);
      }
    }

    function endGame(won) {
      isGameOver = true;
      overTitle.textContent = won ? 'You Won!' : 'Game Over';
      overTitle.style.color = won ? '#22c55e' : '#ef4444';
      overScore.textContent = `Final Score: ${score}`;
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }

      // Draw Ball
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.closePath();

      // Draw Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(paddleX, canvas.height - paddleHeight - 8, paddleWidth, paddleHeight);
    }

    function update() {
      if (isGameOver) return;

      collisionDetection();

      // Bounce left/right
      if (ballX + ballDx > canvas.width - ballRadius || ballX + ballDx < ballRadius) {
        ballDx = -ballDx;
      }
      // Bounce top
      if (ballY + ballDy < ballRadius) {
        ballDy = -ballDy;
      } else if (ballY + ballDy > canvas.height - paddleHeight - 8 - ballRadius) {
        // Paddle collision
        if (ballX > paddleX && ballX < paddleX + paddleWidth) {
          ballDy = -Math.abs(ballDy);
          const hitPos = (ballX - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
          ballDx = hitPos * 4.5;
        } else if (ballY + ballDy > canvas.height - ballRadius) {
          lives--;
          livesEl.textContent = '♥'.repeat(Math.max(0, lives));
          if (lives <= 0) {
            endGame(false);
            return;
          } else {
            ballX = canvas.width / 2;
            ballY = canvas.height - 40;
            ballDx = 3.5;
            ballDy = -3.5;
            paddleX = (canvas.width - paddleWidth) / 2;
          }
        }
      }

      // Paddle movement
      if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += 7;
      } else if (leftPressed && paddleX > 0) {
        paddleX -= 7;
      }

      ballX += ballDx;
      ballY += ballDy;

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, relativeX - paddleWidth / 2));
      }
    });

    restartBtn.addEventListener('click', () => {
      reset();
      update();
    });

    reset();
    update();
  </script>
</body>
</html>
