<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
    }
    .badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #334155;
    }
    #game-canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }
    .key-btn {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #475569;
      padding: 2px 8px;
      border-radius: 4px;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 12px;
    }
    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      width: 400px;
      height: 400px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Score: <span id="score">0</span></div>
    <div class="badge">High Score: <span id="highscore">0</span></div>
  </div>

  <div style="position: relative;">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay" style="display: none;">
      <h2 id="overlay-title" style="font-size: 24px; margin-bottom: 8px;">Game Over</h2>
      <p id="overlay-msg" style="color: #94a3b8;">Press Start or Space to play</p>
      <button class="btn" id="start-btn">Play Again</button>
    </div>
  </div>

  <div class="controls">
    Controls: <span class="key-btn">W A S D</span> or <span class="key-btn">↑ ← ↓ →</span> to move | <span class="key-btn">Space</span> to pause/restart
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let highscore = parseInt(localStorage.getItem('snake_hs') || '0', 10);
    highscoreEl.textContent = highscore;
    let gameLoop = null;
    let isGameOver = false;
    let isPaused = false;

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      isGameOver = false;
      isPaused = false;
      placeFood();
      overlay.style.display = 'none';
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function update() {
      if (isPaused || isGameOver) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highscore) {
          highscore = score;
          highscoreEl.textContent = highscore;
          localStorage.setItem('snake_hs', highscore);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#22c55e'; // Head
        } else {
          ctx.fillStyle = '#16a34a';
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'Game Over!';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowup', 'w'].includes(key) && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
        e.preventDefault();
      } else if (['arrowdown', 's'].includes(key) && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
        e.preventDefault();
      } else if (['arrowleft', 'a'].includes(key) && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
        e.preventDefault();
      } else if (['arrowright', 'd'].includes(key) && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
        e.preventDefault();
      } else if (key === ' ' || key === 'spacebar') {
        e.preventDefault();
        if (isGameOver) {
          resetGame();
        } else {
          isPaused = !isPaused;
        }
      }
    });

    startBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
