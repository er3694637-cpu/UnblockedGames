<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Guess</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      letter-spacing: 2px;
      color: #38bdf8;
    }
    .board {
      display: grid;
      grid-template-rows: repeat(6, 44px);
      gap: 6px;
      margin-bottom: 14px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 44px);
      gap: 6px;
    }
    .tile {
      width: 44px;
      height: 44px;
      border: 2px solid #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .tile.correct { background: #22c55e; border-color: #22c55e; color: white; }
    .tile.present { background: #eab308; border-color: #eab308; color: white; }
    .tile.absent { background: #334155; border-color: #334155; color: #94a3b8; }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 420px;
      width: 100%;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 10px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      min-width: 28px;
      text-align: center;
    }
    .key.wide { min-width: 48px; }
    .key:hover { background: #334155; }
    .msg {
      margin-top: 10px;
      height: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <h1>WORD GUESS</h1>
  <div class="board" id="board"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="msg" id="msg"></div>

  <script>
    const WORDS = ['REACT', 'GAMES', 'PIXEL', 'BLOCK', 'CHESS', 'SOLAR', 'BRAIN', 'SPEED', 'FLASH', 'SPACE', 'TRACK', 'SUPER', 'MAGIC', 'LEVEL', 'SCORE', 'CLOUD', 'QUEST', 'POWER'];
    let targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    let currentRow = 0;
    let currentTile = 0;
    let guesses = Array.from({ length: 6 }, () => Array(5).fill(''));
    let gameOver = false;

    const boardEl = document.getElementById('board');
    const kbEl = document.getElementById('keyboard');
    const msgEl = document.getElementById('msg');

    function initBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          rowEl.appendChild(tile);
        }
        boardEl.appendChild(rowEl);
      }
    }

    const KEY_ROWS = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
    ];

    function initKeyboard() {
      kbEl.innerHTML = '';
      KEY_ROWS.forEach(row => {
        const rEl = document.createElement('div');
        rEl.className = 'kb-row';
        row.forEach(key => {
          const btn = document.createElement('button');
          btn.className = 'key' + (key.length > 1 ? ' wide' : '');
          btn.textContent = key;
          btn.id = `key-${key}`;
          btn.addEventListener('click', () => handleInput(key));
          rEl.appendChild(btn);
        });
        kbEl.appendChild(rEl);
      });
    }

    function handleInput(key) {
      if (gameOver) return;

      if (key === 'DEL' || key === 'BACKSPACE') {
        if (currentTile > 0) {
          currentTile--;
          guesses[currentRow][currentTile] = '';
          document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = '';
        }
      } else if (key === 'ENTER') {
        if (currentTile === 5) {
          submitGuess();
        } else {
          showMsg('Not enough letters');
        }
      } else if (/^[A-Z]$/.test(key)) {
        if (currentTile < 5) {
          guesses[currentRow][currentTile] = key;
          document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = key;
          currentTile++;
        }
      }
    }

    function submitGuess() {
      const guess = guesses[currentRow].join('');
      const targetLetters = targetWord.split('');

      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        const char = guess[i];
        const keyBtn = document.getElementById(`key-${char}`);

        if (char === targetWord[i]) {
          tile.classList.add('correct');
          if (keyBtn) { keyBtn.style.background = '#22c55e'; keyBtn.style.borderColor = '#22c55e'; }
          targetLetters[i] = null;
        } else if (targetLetters.includes(char)) {
          tile.classList.add('present');
          if (keyBtn && keyBtn.style.background !== '#22c55e') {
            keyBtn.style.background = '#eab308';
            keyBtn.style.borderColor = '#eab308';
          }
        } else {
          tile.classList.add('absent');
          if (keyBtn) { keyBtn.style.background = '#334155'; keyBtn.style.opacity = '0.5'; }
        }
      }

      if (guess === targetWord) {
        gameOver = true;
        showMsg('Splendid! You guessed it! 🎉');
      } else if (currentRow === 5) {
        gameOver = true;
        showMsg(`Game Over! The word was ${targetWord}`);
      } else {
        currentRow++;
        currentTile = 0;
      }
    }

    function showMsg(text) {
      msgEl.textContent = text;
      setTimeout(() => { if (!gameOver) msgEl.textContent = ''; }, 2500);
    }

    window.addEventListener('keydown', e => {
      const key = e.key.toUpperCase();
      if (key === 'ENTER' || key === 'BACKSPACE' || /^[A-Z]$/.test(key)) {
        handleInput(key);
      }
    });

    initBoard();
    initKeyboard();
  </script>
</body>
</html>
